[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audio_url_transformer"
version = "1.2.0"
authors = [
    {name = "Christopher Toth", email = "q@q-continuum.net"},
]
description = "Determine if certain audio links need to be transformed before they can be played, and do so"
requires-python = ">=3.7"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "requests",
    "yt_dlp",
]
